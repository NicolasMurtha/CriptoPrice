name: Release

# Dispara ao enviar uma tag de versão, por exemplo:
#   git tag v1.3.0 && git push origin v1.3.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CWS_EXTENSION_ID: jbagdmhabgekcnichjjpbfneicoabjmh

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir versão da tag com o manifest
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(jq -r '.version' manifest.json)
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::A tag ($GITHUB_REF_NAME) não bate com a versão do manifest.json ($MANIFEST)"
            exit 1
          fi

      - name: Gerar .zip
        id: build
        run: echo "zip=$(scripts/build.sh)" >> "$GITHUB_OUTPUT"

      - name: Criar Release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.zip }}" \
            --title "CriptoPrice $GITHUB_REF_NAME" \
            --generate-notes

      - name: Verificar secrets da Chrome Web Store
        id: secrets
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          if [ -n "$CWS_SERVICE_ACCOUNT_KEY" ] && [ -n "$CWS_PUBLISHER_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets da Chrome Web Store não configurados. A Release foi criada, mas o envio para a loja foi pulado. Veja docs/PUBLICACAO.md."
          fi

      - name: Publicar na Chrome Web Store
        if: steps.secrets.outputs.ok == 'true'
        env:
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          CWS_ACCESS_TOKEN=$(scripts/sa-token.sh)
          echo "::add-mask::$CWS_ACCESS_TOKEN"
          export CWS_ACCESS_TOKEN
          scripts/publish.sh "${{ steps.build.outputs.zip }}"
