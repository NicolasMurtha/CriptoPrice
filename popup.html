<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>CriptoPrice</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <header class="header">
      <h1>CriptoPrice</h1>
      <div class="acoes">
        <button id="botaoAtualizar" class="botao" type="button" data-i18n-title="btnRefresh">
          <svg class="icone-atualizar" xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18" aria-hidden="true">
            <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A5.99 5.99 0 0 1 12 18a6 6 0 1 1 0-12c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
        <button id="botaoConfig" class="botao" type="button" data-i18n-title="btnSettings" aria-expanded="false" aria-controls="config">
          <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18" aria-hidden="true">
            <path d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.63-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.31-.09.63-.09.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
          </svg>
        </button>
        <button id="botaoTrocar" class="botao" type="button" data-i18n-title="btnCurrency">
          <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18" aria-hidden="true">
            <path d="M4 7h13l-3.5-3.5 1.42-1.42L21.84 8l-6.92 5.92-1.42-1.42L17 9H4V7zm16 10H7l3.5 3.5-1.42 1.42L2.16 16l6.92-5.92 1.42 1.42L7 15h13v2z"/>
          </svg>
          <span id="moeda-atual" class="moeda-atual">BRL</span>
        </button>
      </div>
    </header>

    <main>
      <section id="precos" aria-live="polite">
        <ul id="lista" class="lista"></ul>
        <p id="erro" class="erro" role="alert" hidden></p>
        <p id="atualizado" class="atualizado"></p>
      </section>

      <section id="config" class="config" hidden>
        <h2 data-i18n="settingsTitle">Escolha as moedas</h2>
        <p class="dica" data-i18n="settingsHint">Selecione pelo menos uma.</p>
        <ul id="opcoes" class="opcoes"></ul>
        <button id="botaoConcluir" class="botao botao-primario" type="button" data-i18n="settingsDone">Concluído</button>
      </section>
    </main>

    <footer class="rodape">
      <a class="credito" href="https://www.coingecko.com" target="_blank" rel="noopener noreferrer">
        <span data-i18n="credit">Dados fornecidos por</span>
        <img src="gecko.svg" alt="CoinGecko" class="logo-gecko">
      </a>
      <button id="botaoContato" class="link-contato" type="button" data-i18n="contact" data-i18n-title="contactTitle">Contato</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
